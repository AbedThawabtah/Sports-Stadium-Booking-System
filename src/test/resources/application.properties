spring.application.name=stadium-booking-test

# ===========================
# Database (in-memory H2 for tests)
# ===========================
spring.datasource.url=jdbc:h2:mem:stadium_booking_test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ===========================
# JPA
# ===========================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===========================
# JWT
# ===========================
app.jwt.secret=test-secret-key-for-unit-tests-only-0123456789
app.jwt.access-token-minutes=15
app.jwt.refresh-token-days=7

# ===========================
# File Upload
# ===========================
app.upload.dir=uploads/stadium-images-test

# ===========================
# CORS
# ===========================
app.cors.allowed-origins=http://localhost:4200,http://localhost:3000
